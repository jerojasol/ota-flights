server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Liveness only: must not depend on the API being up.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # The upstream host is the compose service name on purpose (contract in ../AGENTS.md).
    # nginx resolves it once at startup and exits if it cannot. That is acceptable because
    # compose starts this service only after flight-aggregator is healthy, so no resolver is configured.
    location /api/ {
        proxy_pass http://flight-aggregator:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A cold search or a manual aggregation blocks while the providers answer.
        proxy_read_timeout 60s;
    }

    # Vite fingerprints these file names, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
