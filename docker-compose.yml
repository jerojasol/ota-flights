name: ota-flights

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flights}
      POSTGRES_USER: ${POSTGRES_USER:-flights}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flights}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # debugging only
    # ports:
    #   - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # debugging only
    # ports:
    #   - "6379:6379"

  mock-providers:
    build: ./mock-providers
    # Healthcheck: inherited from mock-providers/Dockerfile.
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      MOCK_SEED: ${MOCK_SEED:-42}
      MOCK_INVENTORY_SIZE: ${MOCK_INVENTORY_SIZE:-500}
      MOCK_OVERLAP_RATIO: ${MOCK_OVERLAP_RATIO:-0.30}
      MOCK_INVALID_RATIO: ${MOCK_INVALID_RATIO:-0.05}
      MOCK_CHAOS_ENABLED: ${MOCK_CHAOS_ENABLED:-true}
      MOCK_LATENCY_MIN: ${MOCK_LATENCY_MIN:-100ms}
      MOCK_LATENCY_MAX: ${MOCK_LATENCY_MAX:-5000ms}
      MOCK_ERROR_RATE: ${MOCK_ERROR_RATE:-0.10}

  flight-aggregator:
    build: ./flight-aggregator
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-providers:
        condition: service_healthy
    # Same probe as the Dockerfile (liveness, never /actuator/health: a Redis outage must not mark it unhealthy);
    # restated only to give Flyway on a cold volume more start time and retries.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 6
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-flights}
      DB_USERNAME: ${POSTGRES_USER:-flights}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-flights}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PROVIDER_ALPHA_URL: http://mock-providers:8081/alpha
      PROVIDER_BETA_URL: http://mock-providers:8081/beta
      PROVIDER_GAMMA_URL: http://mock-providers:8081/gamma
      PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-5500ms}
      PROVIDER_BUDGET: ${PROVIDER_BUDGET:-6s}
      MARKUP_PERCENTAGE: ${MARKUP_PERCENTAGE:-5}
      REFERENCE_CURRENCY: ${REFERENCE_CURRENCY:-EUR}
      FRESHNESS_TTL: ${FRESHNESS_TTL:-10m}
      LOCK_TTL: ${LOCK_TTL:-30s}
      WARM_ROUTES: ${WARM_ROUTES:-MAD-JFK,MAD-LHR,BCN-JFK}
      WARM_INTERVAL: ${WARM_INTERVAL:-PT10M}

volumes:
  postgres-data:
